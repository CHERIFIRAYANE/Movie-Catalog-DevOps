apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: movie-catalog
  labels:
    app.kubernetes.io/part-of: movie-catalog
type: Opaque
stringData:
  SECRET_KEY: "replace-with-strong-django-secret-key"
  DATABASE_PASSWORD: "replace-with-strong-postgres-password"
  EMAIL_HOST_USER: "replace-if-email-used"
  EMAIL_HOST_PASSWORD: "replace-if-email-used"
  DEFAULT_FROM_EMAIL: "noreply@moviecatalog.local"
